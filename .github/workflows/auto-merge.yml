name: Auto-merge claude branches to main

on:
  push:
    branches:
      - 'claude/**'
      # The season-model / off-season landing change is big enough to go
      # through a reviewed PR rather than an instant production deploy, so
      # its branch is opted out of auto-merge. Delete this line once that
      # branch is merged — or retire this workflow altogether (see
      # docs/handoff/known-issues.md, "Auto-merge to production").
      - '!claude/league-landing-page-redesign-kwka6r'

permissions:
  contents: write

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Merge to main
        run: |
          git checkout main
          git merge ${{ github.sha }} -m "Auto-merge ${{ github.ref_name }} to main"
          git push origin main
